<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>あたまのたいそう</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Maru+Gothic:wght@500;700;900&display=swap">
<style>
/* レイアウト：1列のゲーム画面。問題カード → 正方形のステージ → 道具ボタン。「ひらめきトラップ」の姉妹版で、こちらは青を主役にする。 */
:root{
  --paper:#E6ECF3;
  --ink:#1F2B45;
  --card:#FFFFFF;
  --terra:#BF5A36;
  --blue:#3F6E9E;
  --sun:#F2C14E;
  --red:#D23F35;
  --green:#3E8E5A;
  --mute:#56637D;
  --grid:#C9D3DF;
  --f-disp:"Dela Gothic One","Hiragino Sans","Yu Gothic",sans-serif;
  --f-body:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Yu Gothic",sans-serif;
  --f-emoji:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif;
  color-scheme:light;
}
[hidden]{display:none!important}
html,body{background:var(--paper);color:var(--ink)}
body{font-family:var(--f-body);font-size:16px;font-weight:500;-webkit-text-size-adjust:100%}
button{font-family:inherit;color:inherit}
.app{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px 28px;display:flex;flex-direction:column;gap:12px}

.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px}
.logo{font-family:var(--f-disp);font-size:18px;letter-spacing:.02em;background:none;border:0;padding:4px 0;cursor:pointer}
.logo b{color:var(--blue);font-weight:400}
.iconbtn{border:2px solid var(--ink);background:var(--card);border-radius:999px;padding:6px 12px;font-weight:700;font-size:14px;cursor:pointer}

.btn{font-weight:900;font-size:17px;border:3px solid var(--ink);border-radius:14px;padding:12px 22px;cursor:pointer;box-shadow:4px 4px 0 var(--ink);transition:transform .08s,box-shadow .08s;background:var(--card)}
.btn:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--ink)}
.btn.primary{background:var(--blue);color:#fff}
.btn.terra{background:var(--terra);color:#fff}
.btn.small{font-size:15px;padding:9px 14px;border-width:2px;box-shadow:3px 3px 0 var(--ink);border-radius:12px}
:focus-visible{outline:3px solid var(--terra);outline-offset:3px}

.title{display:flex;flex-direction:column;gap:14px;padding-top:8px}
.hero{background:var(--card);border:3px solid var(--ink);border-radius:22px;box-shadow:6px 6px 0 var(--ink);padding:26px 22px 22px;position:relative;overflow:hidden}
.hero h1{font-family:var(--f-disp);font-weight:400;font-size:clamp(38px,11vw,58px);line-height:1.08;margin:0;text-wrap:balance}
.hero h1 span{color:var(--blue)}
.hero .mark{position:absolute;right:14px;top:14px;width:92px;height:92px;z-index:0;pointer-events:none;display:grid;grid-template-columns:repeat(3,1fr);gap:5px;transform:rotate(10deg)}
.hero .mark i{border-radius:6px;background:var(--grid)}
.hero .mark i:nth-child(1),.hero .mark i:nth-child(5),.hero .mark i:nth-child(9){background:var(--sun)}
.hero h1,.hero p,.hero .howto,.hero .row{position:relative;z-index:1}
.hero p{margin:12px 0 0;line-height:1.8;font-size:16px;max-width:34em}
.howto{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.chip{border:2px solid var(--ink);border-radius:999px;padding:4px 12px;font-weight:700;font-size:14px;background:var(--paper)}
.row{display:flex;flex-wrap:wrap;gap:12px;margin-top:20px}
.sect{font-family:var(--f-disp);font-weight:400;font-size:18px;margin:8px 0 0;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.sect small{font-family:var(--f-body);font-size:13px;color:var(--mute);font-weight:700}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:10px}
.lv{min-height:62px;border:2px solid var(--ink);border-radius:14px;background:var(--card);cursor:pointer;position:relative;box-shadow:3px 3px 0 var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:6px 2px}
.lv b{font-family:var(--f-disp);font-weight:400;font-size:20px;line-height:1}
.lv small{font-size:11px;font-weight:700;color:var(--mute);line-height:1.2;text-align:center}
.lv.done{background:var(--sun)}
.lv.done::after{content:"";position:absolute;right:5px;top:5px;width:11px;height:11px;border:3px solid var(--terra);border-radius:50%}
.pagenote{font-size:13px;color:var(--mute);margin:0;line-height:1.6;flex:1 1 220px}
.resetrow{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.confirm{background:var(--card);border:2px solid var(--ink);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:10px;font-weight:700;line-height:1.6}
.confirm .ovbtns{justify-content:flex-start}

.play{display:flex;flex-direction:column;gap:12px}
.qcard{background:var(--card);border:3px solid var(--ink);border-radius:16px;padding:10px 16px 12px;display:flex;flex-direction:column;gap:4px}
.qmeta{display:flex;align-items:center;justify-content:space-between;gap:8px}
.qno{background:var(--blue);color:#fff;font-weight:900;font-size:13px;border-radius:999px;padding:3px 12px;letter-spacing:.04em}
.prog{font-size:13px;color:var(--mute);font-variant-numeric:tabular-nums}
#q{font-family:var(--f-disp);font-weight:400;font-size:clamp(19px,5.4vw,25px);line-height:1.45;margin:0;text-wrap:balance;word-break:keep-all;overflow-wrap:anywhere}

.stagewrap{position:relative;width:min(100%,480px,max(300px,calc(100svh - 290px)));margin:0 auto}
.stage{position:relative;aspect-ratio:1/1;width:100%;max-width:100%;background:var(--card);border:3px solid var(--ink);border-radius:18px;box-shadow:6px 6px 0 var(--ink);overflow:hidden;container-type:inline-size;touch-action:none;user-select:none;-webkit-user-select:none}
.stage.shake{animation:shake .38s}
.stage.pond{background:#9CCBE3}

.item{position:absolute;transform:translate(-50%,-50%);font-family:var(--f-emoji);line-height:1;cursor:pointer;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
.item .g{display:block;transition:transform .25s,filter .3s,opacity .3s}
.item.drag{cursor:grab}
.item.lift{z-index:50 !important;cursor:grabbing}
.item.lift .g{transform:scale(1.08);filter:drop-shadow(0 6px 4px rgba(31,43,69,.35))}
.item.anim{transition:left .4s ease,top .4s ease}
.item.deco{pointer-events:none}
.item.gone{display:none}
.num{font-family:var(--f-disp);color:var(--ink);font-weight:400}
.pill{display:block;font-family:var(--f-disp);font-size:6.4cqw;color:var(--ink);background:var(--paper);border:.7cqw solid var(--ink);border-radius:999px;padding:1.5cqw 4cqw;box-shadow:.9cqw .9cqw 0 var(--ink);white-space:nowrap;text-align:center}
.pill.sm{font-size:5.4cqw;padding:1.3cqw 3.4cqw}
.pill.xs{font-size:4.4cqw;padding:1.1cqw 2.8cqw;box-shadow:.6cqw .6cqw 0 var(--ink)}
.pill.go{background:var(--terra);color:#fff}
.pill.arrow{font-size:7cqw;width:14cqw;padding:1.4cqw 0;background:#fff}
.rules{width:88cqw;font-family:var(--f-body);font-size:3.4cqw;line-height:1.55;color:var(--ink);background:#F4F7FB;border:.5cqw solid var(--ink);border-radius:2cqw;padding:1.4cqw 2.6cqw;font-weight:700;box-sizing:border-box}
.rules.big{font-size:3.8cqw}
.legend{font-family:var(--f-body);font-weight:900;font-size:3.6cqw;color:var(--ink);white-space:nowrap}

.cell{box-sizing:border-box;border:.6cqw solid var(--ink);background:#fff;border-radius:1.4cqw;display:grid;place-items:center;font-family:var(--f-emoji);line-height:1;transition:background .15s}
.cell.given{background:#DCE3EC}
.cell.bad{background:#F6C9C4}
.cell.on{background:var(--sun)}
.cell.win{background:var(--sun)}
.ttt{font-family:var(--f-disp);font-size:14cqw}
.ttt.o{color:var(--terra)} .ttt.x{color:var(--blue)}
.thick{background:var(--ink);border-radius:.7cqw}
.slot{width:17cqw;height:20cqw;border:.7cqw dashed var(--mute);border-radius:2cqw;background:rgba(255,255,255,.6);box-sizing:border-box}
.slot.s2{width:13.5cqw;height:15cqw}
.slot.w{width:21cqw;height:12cqw}

/* いえ */
.hs{width:24cqw;height:30cqw;position:relative}
.hs .roof{position:absolute;left:-2cqw;right:-2cqw;top:0;height:11cqw;background:var(--ink);clip-path:polygon(50% 0,100% 100%,0 100%)}
.hs .bd{position:absolute;left:0;right:0;bottom:0;height:20cqw;border:.7cqw solid var(--ink);box-sizing:border-box}

/* てんびん */
.beam2{width:72cqw;height:1.8cqw;background:var(--ink);border-radius:1cqw;transition:transform .5s}
.post2{width:2.4cqw;height:20cqw;background:var(--ink);border-radius:1cqw}
.pan3{width:36cqw;height:21cqw;border:.7cqw solid var(--ink);border-radius:0 0 5cqw 5cqw;background:#F3E6C8;box-sizing:border-box}
.coin{width:9cqw;height:9cqw;border-radius:50%;background:#E9C46A;border:.6cqw solid var(--ink);display:grid;place-items:center;font-family:var(--f-disp);font-size:4.4cqw;color:var(--ink);box-sizing:border-box}
.dropbox{width:32cqw;height:14cqw;border:.7cqw dashed var(--red);border-radius:2cqw;display:grid;place-items:center;font-family:var(--f-body);font-weight:900;font-size:3.6cqw;color:var(--red);background:#fff;box-sizing:border-box;text-align:center;line-height:1.3}

/* いろ・まる */
.dot{border-radius:50%;border:.6cqw solid var(--ink);box-sizing:border-box;background:#fff}
.dot.empty{background:#EEF2F7;border-color:var(--grid)}
.fb{font-family:var(--f-body);font-weight:900;font-size:5cqw;color:var(--ink);white-space:nowrap;letter-spacing:.4cqw}

/* かたち */
.shp{position:relative}
.shp i{position:absolute;border:.45cqw solid var(--ink);box-sizing:border-box}
.optbox{width:20cqw;height:20cqw;background:#fff;border:.7cqw solid var(--ink);border-radius:2.4cqw;display:grid;place-items:center;box-sizing:border-box;box-shadow:.8cqw .8cqw 0 var(--ink)}
.optbox.big{width:32cqw;height:32cqw;background:#F4F7FB;box-shadow:none}
.optbox.wide{width:44cqw;height:38cqw}
.atile{width:11cqw;height:11cqw;border:.6cqw solid var(--ink);border-radius:2cqw;background:#fff;display:grid;place-items:center;font-family:var(--f-disp);font-size:7.4cqw;box-sizing:border-box;color:var(--ink)}
.atile span{display:inline-block;line-height:1}
.atile.q{background:var(--sun)}
.atile.opt{width:16cqw;height:16cqw;font-size:10cqw;box-shadow:.8cqw .8cqw 0 var(--ink)}
.atile.sm{width:9cqw;height:9cqw;font-size:6cqw}

.lines line{stroke:#B9C0CC;stroke-width:2.6;stroke-linecap:round;transition:stroke .2s}
.lines line.used{stroke:var(--terra)}
.node{width:10cqw;height:10cqw;border-radius:50%;background:#fff;border:.8cqw solid var(--ink);box-sizing:border-box;transition:background .15s}
.node.cur{background:var(--terra)}

.pboard{width:48cqw;height:48cqw;background-color:#fff;background-image:linear-gradient(var(--grid) .35cqw,transparent .35cqw),linear-gradient(90deg,var(--grid) .35cqw,transparent .35cqw);background-size:12cqw 12cqw;box-shadow:0 0 0 .8cqw var(--ink)}
.rboard{width:84cqw;height:84cqw;background-color:#E9EDF2;background-image:linear-gradient(var(--grid) .35cqw,transparent .35cqw),linear-gradient(90deg,var(--grid) .35cqw,transparent .35cqw);background-size:14cqw 14cqw;box-shadow:0 0 0 .8cqw var(--ink)}
.car{box-sizing:border-box;border:.8cqw solid var(--ink);border-radius:2.6cqw;display:grid;place-items:center;font-family:var(--f-disp);color:#fff;font-size:6cqw}
.exit{font-family:var(--f-disp);color:var(--red);font-size:7cqw}
.iceb{width:72cqw;height:72cqw;background-color:#DDF0F8;background-image:linear-gradient(#B8DCEB .3cqw,transparent .3cqw),linear-gradient(90deg,#B8DCEB .3cqw,transparent .3cqw);background-size:12cqw 12cqw;box-shadow:0 0 0 .8cqw var(--ink)}
.sbase{width:70cqw;height:70cqw;background:#EFE6D6;box-shadow:0 0 0 .8cqw var(--ink)}
.wallb{width:10cqw;height:10cqw;background:#5B6478;box-shadow:inset 0 0 0 .4cqw #4A5265}
.goal{width:6cqw;height:6cqw;border-radius:50%;border:.7cqw dashed var(--terra);box-sizing:border-box}
.item.ongoal .g{filter:drop-shadow(0 0 1.6cqw var(--sun)) drop-shadow(0 0 .6cqw var(--sun))}

.card2{width:17.5cqw;height:17.5cqw;border:.7cqw solid var(--ink);border-radius:2.2cqw;background:var(--blue);display:grid;place-items:center;font-size:10cqw;box-sizing:border-box;box-shadow:.7cqw .7cqw 0 var(--ink);transition:background .2s}
.card2 span{visibility:hidden}
.card2.open{background:#fff}
.card2.open span{visibility:visible}
.card2.done{background:#FFF1C7}
.cupx{width:20cqw;height:22cqw;background:var(--terra);border:.8cqw solid var(--ink);border-radius:5cqw 5cqw 1.4cqw 1.4cqw;box-sizing:border-box;box-shadow:inset 0 -3.2cqw 0 rgba(0,0,0,.16)}
.ball{width:9cqw;height:9cqw;border-radius:50%;background:var(--blue);border:.6cqw solid var(--ink);box-sizing:border-box}
.qbox{font-family:var(--f-body);font-weight:900;font-size:5.4cqw;background:#fff;border:.7cqw solid var(--ink);border-radius:3cqw;padding:2.4cqw 4cqw;white-space:nowrap;color:var(--ink)}
.wcard{font-family:var(--f-disp);font-size:4.6cqw;background:#fff;border:.6cqw solid var(--ink);border-radius:2cqw;width:20cqw;padding:2.4cqw 0;text-align:center;box-shadow:.7cqw .7cqw 0 var(--ink);white-space:nowrap;color:var(--ink);box-sizing:border-box}
.wcard.fixed{background:var(--sun)}
.lily{width:12cqw;height:7cqw;border-radius:50%;background:#6FB37E;border:.6cqw solid var(--ink);box-sizing:border-box}

.say{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:8px 16px;border-radius:18px;font-weight:700;font-size:15px;line-height:1.45;width:max-content;max-width:88%;text-align:center;opacity:0;transition:opacity .25s;pointer-events:none;z-index:60;box-sizing:border-box}
.say.on{opacity:1}
.xmark{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-family:var(--f-disp);font-size:150px;line-height:1;color:var(--terra);opacity:0;pointer-events:none;z-index:61;text-shadow:4px 4px 0 var(--card)}
.xmark.on{animation:xpop .7s ease forwards}

.tools{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;padding-top:6px}

.ov{position:fixed;inset:0;background:rgba(31,43,69,.55);display:grid;place-items:center;padding:16px;z-index:100}
.ovcard{background:var(--card);border:3px solid var(--ink);border-radius:20px;box-shadow:6px 6px 0 var(--ink);max-width:420px;width:100%;max-height:calc(100svh - 32px);overflow:auto;padding:24px 20px;text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center;box-sizing:border-box}
.stamp{width:118px;height:118px;border:15px solid var(--terra);border-radius:50%;animation:stamp .5s cubic-bezier(.2,1.6,.4,1);box-sizing:border-box;flex:none}
.ovcard h3{font-family:var(--f-disp);font-weight:400;font-size:32px;margin:0;color:var(--terra)}
.ovcard h3.blue{color:var(--blue)}
.ovcard p{margin:0;line-height:1.8;font-size:16px;text-align:left}
.ans{background:var(--paper);border-radius:12px;padding:10px 14px;width:100%;box-sizing:border-box}
.ovbtns{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}

.end{display:flex;flex-direction:column;gap:16px;padding-top:10px}
.end .hero{text-align:center}
.end .big{font-family:var(--f-disp);font-size:clamp(34px,10vw,50px);margin:0;color:var(--blue)}

@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-10px)}40%{transform:translateX(9px)}60%{transform:translateX(-6px)}80%{transform:translateX(4px)}}
@keyframes xpop{0%{opacity:0;transform:translate(-50%,-50%) scale(.4)}25%{opacity:1;transform:translate(-50%,-50%) scale(1.05)}70%{opacity:1}100%{opacity:0;transform:translate(-50%,-50%) scale(1)}}
@keyframes stamp{0%{transform:scale(2.2);opacity:0}100%{transform:scale(1);opacity:1}}
@media (prefers-reduced-motion:reduce){ .stage.shake{animation:none} }
</style>
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <button class="logo" id="home" type="button">あたまの<b>たいそう</b></button>
    <button class="iconbtn" id="mute" type="button" aria-pressed="false">おと あり</button>
  </header>

  <section class="title" id="scr-title">
    <div class="hero">
      <div class="mark" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
      <h1>あたまの<br><span>たいそう</span></h1>
      <p>すいり・かたち・きおく の 3つの へやに、ぱずるが 8もんずつ。ぜんぶで 24もん です。けいさんは いりません。じっくり かんがえて、ゆびで とこう。</p>
      <div class="howto">
        <span class="chip">さわる ＝ とんと おす</span>
        <span class="chip">ひっぱる ＝ ゆびで うごかす</span>
        <span class="chip">こまったら ひんと</span>
      </div>
      <div class="row">
        <button class="btn primary" id="start" type="button">はじめる</button>
      </div>
    </div>
    <div id="sections"></div>
    <div class="resetrow"><p class="pagenote">といた もんだいには ○が つきます（この ぶらうざに きろく されます）。</p><button class="btn small" id="reset" type="button">きろくを けす</button></div>
    <div class="confirm" id="confirm" hidden><span>○の きろくと、ひんとを みた かいすうを ぜんぶ けしますか？</span><div class="ovbtns"><button class="btn small terra" id="reset-yes" type="button">けす</button><button class="btn small" id="reset-no" type="button">やめる</button></div></div>
  </section>

  <section class="play" id="scr-play" hidden>
    <div class="qcard">
      <div class="qmeta"><span class="qno" id="qno">だい1もん</span><span class="prog" id="prog">1 / 24</span></div>
      <h2 id="q"></h2>
    </div>
    <div class="stagewrap">
      <div class="stage" id="stage"></div>
      <div class="xmark" id="xmark" aria-hidden="true">×</div>
      <div class="say" id="say" role="status" aria-live="polite"></div>
    </div>
    <div class="tools">
      <button class="btn small primary" id="btn-hint" type="button">ひんと</button>
      <button class="btn small" id="btn-retry" type="button">やりなおす</button>
      <button class="btn small" id="btn-menu" type="button">もんだい えらび</button>
    </div>
  </section>

  <section class="end" id="scr-end" hidden>
    <div class="hero">
      <p class="big">ぜんもん くりあ！</p>
      <p id="endtxt" style="text-align:center;max-width:none"></p>
      <div class="row" style="justify-content:center">
        <button class="btn primary" id="again" type="button">さいしょから あそぶ</button>
        <button class="btn" id="tomenu" type="button">もんだい えらびへ</button>
      </div>
    </div>
  </section>
</div>

<div class="ov" id="ov-clear" hidden>
  <div class="ovcard" role="dialog" aria-modal="true" aria-labelledby="clear-h">
    <div class="stamp" aria-hidden="true"></div>
    <h3 id="clear-h">せいかい！</h3>
    <p id="clear-txt"></p>
    <div class="ovbtns"><button class="btn terra" id="btn-next" type="button">つぎの もんだいへ</button></div>
  </div>
</div>

<div class="ov" id="ov-hint" hidden>
  <div class="ovcard" role="dialog" aria-modal="true" aria-labelledby="hint-h">
    <h3 class="blue" id="hint-h">ひんと</h3>
    <p id="hint-txt"></p>
    <p class="ans" id="ans-txt" hidden></p>
    <div class="ovbtns">
      <button class="btn small" id="btn-ans" type="button">こたえを みる</button>

  ctr(cr){ const [r,c,l,d]=cr; return [this.BX+(c+(d==='h'?l:1)/2)*this.CS, this.BY+(r+(d==='v'?l:1)/2)*this.CS]; },
  items(){

    this.CARS.forEach((cr,i)=>{ const [x,y]=this.ctr(cr), W=(cr[3]==='h'?cr[2]*this.CS:this.CS)-1.6, H=(cr[3]==='v'?cr[2]*this.CS:this.CS)-1.6;
      r.push({id:'car'+i,html:'<div class="car" style="width:'+W+'cqw;height:'+H+'cqw;background:'+this.COL[i]+'">'+(i===0?'→':'')+'</div>',x,y,drag:1}); });

  init(a){ a.state.cars=this.CARS.map(c=>c.slice()); },
  free(a,k,r,c){ return a.state.cars.every((cr,i)=>{ if(i===k) return true; const [rr,cc,l,d]=cr; for(let t=0;t<l;t++){ if((d==='h'?rr:rr+t)===r&&(d==='h'?cc+t:cc)===c) return false; } return true; }); },
  onGrab(id,a){

    if(d==='h'){ mn=c; while(mn-1>=0&&this.free(a,k,r,mn-1)) mn--; mx=c; while(mx+l<=5&&this.free(a,k,r,mx+l)) mx++; }

    if(cr[3]==='h') a.pos(id,this.BX+(f+l/2)*this.CS,this.ctr(cr)[1]); else a.pos(id,this.ctr(cr)[0],this.BY+(f+l/2)*this.CS);

{
  name:'にもつ はこび',
  q:'くまさんで にもつを おして、2つとも まるい しるしの うえに のせて',
  hint:'にもつは おす ことしか できず、ひっぱれない。かべの すみに おしこむと うごかせなく なるので、うごかせなく なったら「やりなおす」。',
  answer:'さいたん 26ぽ で できます。「うごかして みせる」で、こたえの うごかしかたが みられます。',
  explain:'にもつを おす じゅんばんと むきを よみきりました。「そうこばん」と よばれる ぱずる です。',
  LV:['#######','#.  # #','#  $  #','# #$# #','#  @ .#','#     #','#######'],
  CS:10, BX:15, BY:2, PATH:'rruulldulrrrdddlllurrllluu',
  at(r,c){ return [this.BX+(c+.5)*this.CS, this.BY+(r+.5)*this.CS]; },
  items(){
    const r=[{id:'base',html:'<div class="sbase"></div>',x:50,y:37,deco:1}]; let n=0;
    this.LV.forEach((row,rr)=>row.split('').forEach((ch,cc)=>{ const [x,y]=this.at(rr,cc);
      if(ch==='#') r.push({id:'w'+rr+'_'+cc,html:'<div class="wallb"></div>',x,y,deco:1});
      if(ch==='.') r.push({id:'gl'+rr+'_'+cc,html:'<div class="goal"></div>',x,y,deco:1}); }));
    this.LV.forEach((row,rr)=>row.split('').forEach((ch,cc)=>{ const [x,y]=this.at(rr,cc);
      if(ch==='$') r.push({id:'bx'+(n++),g:'📦',x,y,s:7.6});
      if(ch==='@') r.push({id:'pl',g:'🐻',x,y,s:7.6}); }));
    [['ku','↑',40],['kd','↓',60],['kl','←',20],['kr','→',80]].forEach(k=>r.push({id:k[0],html:PILL(k[1],'arrow'),x:k[2],y:88}));
    return r;
  },
  init(a){
    const s=a.state; s.box=[]; s.goal=[];
    this.LV.forEach((row,r)=>row.split('').forEach((ch,c)=>{ if(ch==='$') s.box.push([r,c]); if(ch==='@') s.pl=[r,c]; if(ch==='.') s.goal.push(r+','+c); }));
  },
  wall(r,c){ return this.LV[r][c]==='#'; },
  step(a,d){
    const s=a.state, D={u:[-1,0],d:[1,0],l:[0,-1],r:[0,1]}[d], n=[s.pl[0]+D[0],s.pl[1]+D[1]];
    if(this.wall(n[0],n[1])) return;
    const bi=s.box.findIndex(b=>b[0]===n[0]&&b[1]===n[1]);
    if(bi>=0){
      const n2=[n[0]+D[0],n[1]+D[1]];
      if(this.wall(n2[0],n2[1])||s.box.some(b=>b[0]===n2[0]&&b[1]===n2[1])){ a.say('おせない…'); return; }
      s.box[bi]=n2; const [x,y]=this.at(n2[0],n2[1]); a.move('bx'+bi,x,y);
      a.el('bx'+bi).classList.toggle('ongoal',s.goal.includes(n2.join(',')));
    }
    s.pl=n; const [x,y]=this.at(n[0],n[1]); a.move('pl',x,y); a.beep(360);
    if(s.box.every(b=>s.goal.includes(b.join(',')))) a.timer(()=>a.clear(),450);
  },
  onTap(id,a){ const m={ku:'u',kd:'d',kl:'l',kr:'r'}[id]; if(m) this.step(a,m); else a.say('やじるしを おして うごかしてね'); },
  onKey(k,a){ const m={ArrowUp:'u',ArrowDown:'d',ArrowLeft:'l',ArrowRight:'r'}[k]; if(m){ this.step(a,m); return true; } },
  demo(a){ this.PATH.split('').forEach((d,i)=>a.timer(()=>this.step(a,d),i*380)); return this.PATH.length*380; }
},

        const op={u:'d',d:'u',l:'r',r:'l'};
        const ok=['u','d','l','r'].filter(d=>d!==op[prev]&&((d==='u'&&cur[0]>0)||(d==='d'&&cur[0]<4)||(d==='l'&&cur[1]>0)||(d==='r'&&cur[1]<4)));
        const d=ok[Math.floor(Math.random()*ok.length)]; path.push(d); prev=d;
        cur=[cur[0]+(d==='u'?-1:d==='d'?1:0),cur[1]+(d==='l'?-1:d==='r'?1:0)];
      }
    } while(cur[0]===st[0]&&cur[1]===st[1]);
    s.st=st; s.path=path; s.fin=cur; s.busy=false;
    for(let k=0;k<25;k++){ const c=a.el('g'+k).querySelector('.cell'); c.textContent=(k===st[0]*5+st[1])?'⭐':''; c.classList.remove('on'); }
    path.forEach((d,i)=>a.el('ar'+i).querySelector('.atile span').textContent=this.AR[d]);
    a.el('lb').querySelector('.pill').textContent=s.round+'もんめ / 2';
  },
  onTap(id,a){
    const s=a.state; if(s.busy) return;
    const k=+id.slice(1), fin=s.fin[0]*5+s.fin[1];
    if(k===fin){
      s.busy=true; a.el('g'+k).querySelector('.cell').textContent='💎'; a.beep(700);
      if(s.round===1){ a.say('せいかい！ もう 1もん'); a.timer(()=>{ s.round=2; this.gen(a); },1300); }
      else a.timer(()=>a.clear(),500);
    } else {
      s.busy=true; a.wrong('ちがうよ。みちを みせるね'); let cur=s.st.slice();
      s.path.forEach((d,i)=>a.timer(()=>{ cur=[cur[0]+(d==='u'?-1:d==='d'?1:0),cur[1]+(d==='l'?-1:d==='r'?1:0)]; const c=a.el('g'+(cur[0]*5+cur[1])).querySelector('.cell'); c.classList.add('on'); if(i===s.path.length-1) c.textContent='💎'; },700+i*320));
      a.timer(()=>this.gen(a),700+s.path.length*320+1500);
    }
  }
},
{
  name:'しりとりの わ',
  q:'しりとりで つながるように ならべて、さいごに「りんご」へ もどして',
  hint:'「ら」で はじまる ことばが 2つ ある。さきに つかうと、とちゅうで りんごに もどって しまう ほうに ちゅうい。',
  answer:'りんご → ごりら → らくだ → だちょう → うま → まくら → らっぱ → ぱせり →（りんご に もどる）',
  explain:'8つ ぜんぶ つかって、ぐるっと 1しゅう。ことばの じゅんばん ぱずる でした。',
  W:{w1:'ごりら',w2:'らくだ',w3:'だちょう',w4:'うま',w5:'まくら',w6:'らっぱ',w7:'ぱせり'},
  SL:[[38,24],[62,24],[86,24],[14,46],[38,46],[62,46],[86,46]],
  bad:'しりとりが つながって いない ところが あるよ',
  items(){
    const r=[{id:'lb',html:'<div class="legend">りんご から はじめて、ぐるっと りんごに もどる</div>',x:50,y:8,deco:1},
      {id:'w0',html:'<div class="wcard fixed">りんご</div>',x:14,y:24,deco:1}];
    this.SL.forEach((p,k)=>r.push({id:'s'+k,html:'<div class="slot w"></div>',x:p[0],y:p[1],deco:1}));
    const T=shuffle([[14,70],[38,70],[62,70],[86,70],[26,88],[50,88],[74,88]]);
    Object.keys(this.W).forEach((k,i)=>r.push({id:k,html:'<div class="wcard">'+this.W[k]+'</div>',x:T[i][0],y:T[i][1],drag:1}));
    return r;
  },
  init(a){ a.state.slot=Array(7).fill(null); },
  check(s){
    const seq=['りんご',...s.map(id=>this.W[id]),'りんご'];
    for(let i=0;i<seq.length-1;i++){ if(seq[i].slice(-1)!==seq[i+1][0]) return false; }
    return true;
  },
  onTap(id,a){ a.say('ひっぱって わくに いれてね'); },
  onDrop(id,a){ slotDrop(this,a,id,11,8); }
},
{
  name:'かえるの いれかえ',
  q:'かえると うさぎの ばしょを、ぜんぶ いれかえて',
  hint:'すすめる なら すすむ、とびこせる なら とぶ。おなじ なかまが 2ひき ならんで つまると うごけなく なるので、こうごに うごかすのが こつ。',
  answer:'かえる と うさぎを ほぼ こうごに うごかし、「となりが あいたら すすむ、とびこせるなら とぶ」を くりかえします。さいたん 15かい です。',
  explain:'15かいで いれかわりました。むかしから ある「かえる とび」の ぱずる です。',
  X:[8,22,36,50,64,78,92], SEQ:[2,4,5,3,1,0,2,4,6,5,3,1,2,4,3],
  items(){
    const r=[{id:'rules',html:'<div class="rules">🐸は みぎへ、🐰は ひだりへ しか すすめない。<br>となりが あいて いれば 1ます すすむ。1ぴき だけ とびこえる ことも できる。<br>さわった こが うごくよ。</div>',x:50,y:16,deco:1}];
    this.X.forEach((x,i)=>r.push({id:'p'+i,html:'<div class="lily"></div>',x,y:66,deco:1}));
    ['f0','f1','f2'].forEach((id,i)=>r.push({id,g:'🐸',x:this.X[i],y:60,s:10.5}));
    ['r0','r1','r2'].forEach((id,i)=>r.push({id,g:'🐰',x:this.X[i+4],y:60,s:10.5}));
    return r;
  },
  init(a){ a.state.pos=['f0','f1','f2',null,'r0','r1','r2']; },
  canMove(pos,i){
    const id=pos[i]; if(!id) return -1; const d=id[0]==='f'?1:-1;
    if(i+d>=0&&i+d<7&&!pos[i+d]) return i+d;
    if(i+2*d>=0&&i+2*d<7&&!pos[i+2*d]&&pos[i+d]) return i+2*d;
    return -1;
  },
  onTap(id,a){
    const s=a.state; if(s.busy) return;
    const i=s.pos.indexOf(id), j=this.canMove(s.pos,i);
    if(j<0){ a.say('その こは いま うごけない'); return; }
    s.pos[j]=id; s.pos[i]=null; a.beep(Math.abs(j-i)===2?620:480);
    if(Math.abs(j-i)===2){ a.move(id,(this.X[i]+this.X[j])/2,44); a.timer(()=>a.move(id,this.X[j],60),220); } else a.move(id,this.X[j],60);
    if(s.pos.slice(0,3).every(v=>v&&v[0]==='r')&&s.pos.slice(4).every(v=>v&&v[0]==='f')){ a.timer(()=>a.clear(),500); return; }
    if(![0,1,2,3,4,5,6].some(k=>this.canMove(s.pos,k)>=0)){ s.busy=true; a.wrong('もう だれも うごけない… やりなおし'); a.timer(()=>a.restart(),1800); }
  },
  demo(a){ this.SEQ.forEach((i,n)=>a.timer(()=>this.onTap(a.state.pos[i],a),n*650)); return this.SEQ.length*650; }
}
];

/* ===== きろく ===== */
const KEY='atama-taiso-v2';
let saved={cleared:[],hints:0};
try{ const s=JSON.parse(localStorage.getItem(KEY)||'null'); if(s&&Array.isArray(s.cleared)) saved=s; }catch(e){}
function save(){ try{ localStorage.setItem(KEY,JSON.stringify(saved)); }catch(e){} }

let cur=0, done=false, state={}, timers=[], muted=false, sayT=null;
const $=id=>document.getElementById(id);
const stage=$('stage');
const lv=()=>LEVELS[cur];

/* ===== おと ===== */
let ac=null;
function tone(seq){
  if(muted) return;
  try{
    ac=ac||new (window.AudioContext||window.webkitAudioContext)();
    const t=ac.currentTime;
    seq.forEach(([f,d,st])=>{
      const o=ac.createOscillator(), g=ac.createGain();
      o.type='triangle'; o.frequency.value=f;
      g.gain.setValueAtTime(.0001,t+st);
      g.gain.exponentialRampToValueAtTime(.18,t+st+.02);
      g.gain.exponentialRampToValueAtTime(.0001,t+st+d);
      o.connect(g); g.connect(ac.destination);
      o.start(t+st); o.stop(t+st+d+.05);
    });
  }catch(e){}
}

/* ===== しくみ ===== */
function stopTimers(){ timers.forEach(t=>{clearTimeout(t);clearInterval(t);}); timers=[]; }
function setPos(el,x,y){ el.dataset.x=x; el.dataset.y=y; el.style.left=x+'%'; el.style.top=y+'%'; }
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));

const api={
  get state(){ return state; },
  el:id=>stage.querySelector('[data-id="'+id+'"]'),
  set(id,g){ const e=api.el(id); if(e) e.querySelector('.g').textContent=g; },
  hide(id){ const e=api.el(id); if(e) e.classList.add('gone'); },
  show(id){ const e=api.el(id); if(e) e.classList.remove('gone'); },
  pos(id,x,y){ const e=api.el(id); if(e) setPos(e,x,y); },
  move(id,x,y){ const e=api.el(id); if(!e) return; e.classList.add('anim'); setPos(e,x,y); clearTimeout(e._at); e._at=setTimeout(()=>e.classList.remove('anim'),450); },
  back(id){ const e=api.el(id); if(e) api.move(id,+e.dataset.ox,+e.dataset.oy); },
  timer(fn,ms){ timers.push(setTimeout(fn,ms)); },
  stopTimers,
  restart(){ startLevel(cur); },
  beep(f){ tone([[f,.2,0]]); },
  say(msg){
    const s=$('say'); s.textContent=msg; s.classList.add('on');
    clearTimeout(sayT); sayT=setTimeout(()=>s.classList.remove('on'),Math.max(2000,1000+msg.length*90));
  },
  wrong(msg){
    stage.classList.remove('shake'); void stage.offsetWidth; stage.classList.add('shake');
    const x=$('xmark'); x.classList.remove('on'); void x.offsetWidth; x.classList.add('on');
    if(msg) api.say(msg);
    tone([[233,.22,0],[175,.3,.13]]);
  },
  clear(){
    if(done||state.demo) return;
    done=true; stopTimers();
    if(!saved.cleared.includes(cur)) saved.cleared.push(cur);
    save();
    tone([[523,.16,0],[659,.16,.12],[784,.32,.24]]);
    setTimeout(showClear,650);
  }
};

function secOf(i){ return SECTIONS[Math.floor(i/PER)]; }

function startLevel(i){
  stopTimers();
  cur=i; done=false; state={};
  const L=lv();
  show('play');
  $('qno').textContent='だい'+(i+1)+'もん・'+secOf(i).name;
  $('prog').textContent=(i+1)+' / '+LEVELS.length;
  $('q').textContent=L.q;
  $('say').classList.remove('on');
  stage.className='stage'+(L.bg?' '+L.bg:'');
  stage.innerHTML='';
  const items=typeof L.items==='function'?L.items():L.items;
  items.forEach(it=>{
    const el=document.createElement('div');
    el.className='item'+(it.drag?' drag':'')+(it.cls?' '+it.cls:'')+(it.deco?' deco':'')+(it.hide?' gone':'');
    el.dataset.id=it.id; el.dataset.ox=it.x; el.dataset.oy=it.y;
    if(it.s){ el.style.fontSize=it.s+'cqw'; el.dataset.s=it.s; }
    if(it.z) el.style.zIndex=it.z;
    const g=document.createElement('span'); g.className='g';
    if(it.html) g.innerHTML=it.html; else g.textContent=it.g;
    el.appendChild(g);
    if(!it.deco){ el.tabIndex=0; el.setAttribute('role','button'); el.setAttribute('aria-label',it.g||'ぼたん'); }
    setPos(el,it.x,it.y);
    stage.appendChild(el);
  });
  if(L.init) L.init(api);
  hot();
}

/* さわる・ひっぱる */
let drag=null;
stage.addEventListener('pointerdown',e=>{
  const el=e.target.closest('.item'); if(!el||done||state.demo||el.classList.contains('deco')) return;
  e.preventDefault();
  const r=stage.getBoundingClientRect();
  drag={el,id:el.dataset.id,sx:e.clientX,sy:e.clientY,moved:false,can:el.classList.contains('drag'),
    ox:+el.dataset.x-(e.clientX-r.left)/r.width*100, oy:+el.dataset.y-(e.clientY-r.top)/r.height*100};
  try{ el.setPointerCapture(e.pointerId); }catch(_){}
  if(drag.can){ el.classList.add('lift'); const L=lv(); if(L.onGrab) L.onGrab(drag.id,api); }
});
stage.addEventListener('pointermove',e=>{
  if(!drag) return;
  if(Math.hypot(e.clientX-drag.sx,e.clientY-drag.sy)>8) drag.moved=true;
  if(drag.can&&drag.moved){
    const r=stage.getBoundingClientRect();
    drag.el.classList.remove('anim');
    setPos(drag.el, clamp((e.clientX-r.left)/r.width*100+drag.ox,3,97), clamp((e.clientY-r.top)/r.height*100+drag.oy,3,97));
    const L=lv(); if(L.onMove) L.onMove(drag.id,api);
  }
});
function endDrag(cancel){
  if(!drag) return;
  const d=drag; drag=null; d.el.classList.remove('lift');
  const L=lv();
  if(done) return;
  if(cancel){ if(d.can&&d.moved&&L.onDrop) L.onDrop(d.id,api); return; }
  if(!d.moved){ if(state.rng) state.rng=null; if(L.onTap) L.onTap(d.id,api); }
  else if(d.can && L.onDrop) L.onDrop(d.id,api);
}
stage.addEventListener('pointerup',()=>endDrag(false));
stage.addEventListener('pointercancel',()=>endDrag(true));
stage.addEventListener('keydown',e=>{
  if(e.key!=='Enter'&&e.key!==' ') return;
  const el=e.target.closest('.item'); if(!el||done||state.demo) return;
  e.preventDefault(); const L=lv(); if(L.onTap) L.onTap(el.dataset.id,api);
});
document.addEventListener('keydown',e=>{
  if($('scr-play').hidden||!$('ov-hint').hidden||!$('ov-clear').hidden||done||state.demo) return;
  const L=lv(); if(L.onKey&&L.onKey(e.key,api)) e.preventDefault();
});

/* ===== がめん ===== */
function show(name){
  $('scr-title').hidden=name!=='title';
  $('scr-play').hidden=name!=='play';
  $('scr-end').hidden=name!=='end';
  window.scrollTo(0,0);
}
function renderGrid(){
  const box=$('sections'); box.innerHTML='';
  SECTIONS.forEach((sec,si)=>{
    const h=document.createElement('h2'); h.className='sect';
    h.innerHTML=sec.name+' <small>'+(si*PER+1)+'〜'+(si*PER+PER)+'もん　'+sec.sub+'</small>';
    const g=document.createElement('div'); g.className='grid';
    for(let i=si*PER;i<si*PER+PER;i++){
      const b=document.createElement('button'), ok=saved.cleared.includes(i);
      b.type='button'; b.className='lv'+(ok?' done':'');
      b.innerHTML='<b>'+(i+1)+'</b><small>'+LEVELS[i].name+'</small>';
      b.setAttribute('aria-label','だい'+(i+1)+'もん '+LEVELS[i].name+(ok?'（くりあ ずみ）':''));
      b.onclick=()=>startLevel(i);
      g.appendChild(b);
    }
    box.appendChild(h); box.appendChild(g);
  });
}
function goTitle(){ stopTimers(); closeOv(); renderGrid(); show('title'); hot(); }
function closeOv(){ $('ov-clear').hidden=true; $('ov-hint').hidden=true; }

function showClear(){
  $('ov-hint').hidden=true;
  $('clear-txt').textContent=lv().explain;
  $('btn-next').textContent=cur===LEVELS.length-1?'けっかを みる':(cur+1)%PER===0?'つぎの へやへ':'つぎの もんだいへ';
  $('ov-clear').hidden=false;
  $('btn-next').focus();
}
$('btn-next').onclick=()=>{
  $('ov-clear').hidden=true;
  if(cur<LEVELS.length-1) startLevel(cur+1);
  else{
    stopTimers();
    $('endtxt').textContent='24もん すべて くりあ しました。ひんとを みた かいすうは '+saved.hints+' かい です。ともだちや かぞくとも きそって みてね。';
    show('end');
  }
};
$('btn-hint').onclick=()=>{
  if(done) return;
  saved.hints++; save();
  const L=lv();
  $('hint-txt').textContent=L.hint;
  $('ans-txt').textContent=L.answer;
  $('ans-txt').hidden=true;
  $('btn-ans').hidden=false;
  $('btn-demo').hidden=!L.demo;
  $('ov-hint').hidden=false;
  $('btn-hclose').focus();
};
$('btn-ans').onclick=()=>{ $('ans-txt').hidden=false; $('btn-ans').hidden=true; };
$('btn-demo').onclick=()=>{
  $('ov-hint').hidden=true;
  startLevel(cur); state.demo=true;
  const L=lv();
  api.say('こたえの うごかしかたを みせるね');
  api.timer(()=>{
    const dur=L.demo(api)||1000;
    api.timer(()=>api.say('こんどは じぶんで やって みよう'),dur+400);
    api.timer(()=>startLevel(cur),dur+2600);
  },900);
};
$('btn-hclose').onclick=()=>{ $('ov-hint').hidden=true; };
$('btn-retry').onclick=()=>startLevel(cur);
$('btn-menu').onclick=goTitle;
$('home').onclick=goTitle;
$('tomenu').onclick=goTitle;
$('again').onclick=()=>{ saved={cleared:[],hints:0}; save(); startLevel(0); };
$('start').onclick=()=>{ const first=LEVELS.findIndex((_,i)=>!saved.cleared.includes(i)); startLevel(first<0?0:first); };
$('mute').onclick=()=>{
  muted=!muted;
  $('mute').textContent=muted?'おと なし':'おと あり';
  $('mute').setAttribute('aria-pressed',String(muted));
};

$('reset').onclick=()=>{ $('confirm').hidden=false; };
$('reset-no').onclick=()=>{ $('confirm').hidden=true; };
$('reset-yes').onclick=()=>{ saved={cleared:[],hints:0}; save(); $('confirm').hidden=true; renderGrid(); };

function hot(){ try{ window.claude?.hot?.snapshot?.(()=>({cur,play:!$('scr-play').hidden})); }catch(e){} }
function boot(data){
  renderGrid();
  if(data && data.play && typeof data.cur==='number' && LEVELS[data.cur]) startLevel(data.cur);
  else show('title');
}
if(window.claude?.hot?.ready) window.claude.hot.ready(boot); else boot(window.claude?.hot?.data ?? {});
})();
</script>
