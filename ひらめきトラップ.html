<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>ひらめきトラップ</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Maru+Gothic:wght@500;700;900&display=swap">
<style>
/* レイアウト：1列のゲーム画面。問題カード → 正方形のステージ → 道具ボタン。マンガ風の太い線と影。 */
:root{
  --paper:#E3EEF0;
  --ink:#1F2B45;
  --card:#FFFFFF;
  --terra:#BF5A36;
  --blue:#3F6E9E;
  --sun:#F2C14E;
  --red:#D23F35;
  --green:#3E8E5A;
  --mute:#56637D;
  --f-disp:"Dela Gothic One","Hiragino Sans","Yu Gothic",sans-serif;
  --f-body:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Yu Gothic",sans-serif;
  --f-emoji:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif;
  color-scheme:light;
}
[hidden]{display:none!important}
html,body{background:var(--paper);color:var(--ink)}
body{font-family:var(--f-body);font-size:16px;font-weight:500;-webkit-text-size-adjust:100%}
button{font-family:inherit;color:inherit}
.app{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px 28px;display:flex;flex-direction:column;gap:12px}

.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px}
.logo{font-family:var(--f-disp);font-size:18px;letter-spacing:.02em;background:none;border:0;padding:4px 0;cursor:pointer}
.logo b{color:var(--terra);font-weight:400}
.iconbtn{border:2px solid var(--ink);background:var(--card);border-radius:999px;padding:6px 12px;font-weight:700;font-size:14px;cursor:pointer}

.btn{font-weight:900;font-size:17px;border:3px solid var(--ink);border-radius:14px;padding:12px 22px;cursor:pointer;box-shadow:4px 4px 0 var(--ink);transition:transform .08s,box-shadow .08s;background:var(--card)}
.btn:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--ink)}
.btn.primary{background:var(--terra);color:#fff}
.btn.blue{background:var(--blue);color:#fff}
.btn.small{font-size:15px;padding:9px 14px;border-width:2px;box-shadow:3px 3px 0 var(--ink);border-radius:12px}
:focus-visible{outline:3px solid var(--blue);outline-offset:3px}

/* タイトル画面 */
.title{display:flex;flex-direction:column;gap:14px;padding-top:8px}
.hero{background:var(--card);border:3px solid var(--ink);border-radius:22px;box-shadow:6px 6px 0 var(--ink);padding:26px 22px 22px;position:relative;overflow:hidden}
.hero h1{font-family:var(--f-disp);font-weight:400;font-size:clamp(40px,12vw,62px);line-height:1.05;margin:0;text-wrap:balance}
.hero h1 span{color:var(--terra);display:inline-block;transform:rotate(-4deg)}
.hero .q{position:absolute;right:-6px;top:-18px;font-family:var(--f-disp);font-size:130px;color:var(--sun);transform:rotate(14deg);z-index:0;pointer-events:none}
.hero h1,.hero p,.hero .howto,.hero .row{position:relative;z-index:1}
.hero p{margin:12px 0 0;line-height:1.8;font-size:16px;max-width:34em}
.howto{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.chip{border:2px solid var(--ink);border-radius:999px;padding:4px 12px;font-weight:700;font-size:14px;background:var(--paper)}
.row{display:flex;flex-wrap:wrap;gap:12px;margin-top:20px}
.sect{font-family:var(--f-disp);font-weight:400;font-size:18px;margin:8px 0 0;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.sect small{font-family:var(--f-body);font-size:13px;color:var(--mute);font-weight:700}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.lv{height:58px;border:2px solid var(--ink);border-radius:14px;background:var(--card);font-family:var(--f-disp);font-size:22px;cursor:pointer;position:relative;box-shadow:3px 3px 0 var(--ink);display:grid;place-items:center;padding:0}
.lv.done{background:var(--sun)}
.lv.done::after{content:"";position:absolute;right:5px;top:5px;width:12px;height:12px;border:3px solid var(--terra);border-radius:50%}
.pagenote{font-size:13px;color:var(--mute);margin:0;line-height:1.6}

/* プレイ画面 */
.play{display:flex;flex-direction:column;gap:12px}
.qcard{background:var(--card);border:3px solid var(--ink);border-radius:16px;padding:10px 16px 12px;display:flex;flex-direction:column;gap:4px}
.qmeta{display:flex;align-items:center;justify-content:space-between;gap:8px}
.qno{background:var(--blue);color:#fff;font-weight:900;font-size:13px;border-radius:999px;padding:3px 12px;letter-spacing:.04em}
.prog{font-size:13px;color:var(--mute);font-variant-numeric:tabular-nums}
#q{font-family:var(--f-disp);font-weight:400;font-size:clamp(20px,5.8vw,27px);line-height:1.4;margin:0;text-wrap:balance;word-break:keep-all;overflow-wrap:anywhere}
.qtap{cursor:pointer}
.qtap.red{color:var(--red)}

.stagewrap{position:relative;width:min(100%,480px,max(300px,calc(100svh - 290px)));margin:0 auto}
.stage{position:relative;aspect-ratio:1/1;width:100%;max-width:100%;background:var(--card);border:3px solid var(--ink);border-radius:18px;box-shadow:6px 6px 0 var(--ink);overflow:hidden;container-type:inline-size;touch-action:none;user-select:none;-webkit-user-select:none;transition:background .6s}
.stage.shake{animation:shake .38s}
.stage.night{background:#2D2546}
.stage.river{background:linear-gradient(90deg,#BFE0A8 0 21%,#7FB8DA 21% 79%,#BFE0A8 79%)}
.stage.space{background:linear-gradient(#1E2A50,#4A5C8A 75%,#DCD3C2 75%)}
.stage.pond{background:linear-gradient(#F3EBDD 0 46%,#7FB8DA 46%)}
.stage.house{background:linear-gradient(#F2E3C4 0 72%,#9BC38A 72%)}
.stage.dimroom{background:linear-gradient(#C9CEDB 0 76%,#A99A82 76%)}
.stage.wall2{background:linear-gradient(#E8DCC8 0 76%,#B99B74 76%)}
.stage.room{background:linear-gradient(#EAE4D8 0 76%,#C9B48F 76%)}
.floor{position:absolute;left:0;right:0;bottom:0;height:24%;background:#EFE6D6;border-top:3px solid var(--ink)}
.stage.night .floor{background:#3B3158}

.item{position:absolute;transform:translate(-50%,-50%);font-family:var(--f-emoji);line-height:1;cursor:pointer;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
.item .g{display:block;transition:transform .25s,filter .4s,opacity .4s;transform-origin:50% 100%}
.item.drag{cursor:grab}
.item.lift{z-index:50 !important;cursor:grabbing}
.item.lift .g{transform:scale(1.1);filter:drop-shadow(0 6px 4px rgba(31,43,69,.35))}
.item.anim{transition:left .4s ease,top .4s ease}
.item.deco{pointer-events:none}
.item.gone{display:none}
.num{font-family:var(--f-disp);color:var(--ink);font-weight:400}
.pill{display:block;font-family:var(--f-disp);font-size:7cqw;color:var(--ink);background:var(--paper);border:.7cqw solid var(--ink);border-radius:999px;padding:1.6cqw 4.4cqw;box-shadow:.9cqw .9cqw 0 var(--ink);white-space:nowrap}
.pill.sm{font-size:5.6cqw;padding:1.3cqw 3.4cqw}
.pill.go{background:var(--red);color:#fff}
.pill.em{font-family:var(--f-emoji);font-size:7cqw;padding:1.4cqw 2.6cqw}
.zz .g{animation:bob 1.6s ease-in-out infinite}
.flee .g{animation:flee 1s ease-in forwards}

/* れいぞうこ */
.fridge{position:relative;width:30cqw;height:54cqw;perspective:520px}
.fridge .inside{position:absolute;inset:0;background:repeating-linear-gradient(#E8F3F6 0 12.5cqw,#B9CDD3 12.5cqw 13.2cqw);border:.7cqw solid var(--ink);border-radius:3cqw;display:grid;place-items:center;font-size:13cqw}
.fridge .door{position:absolute;inset:0;background:#F6F7F9;border:.7cqw solid var(--ink);border-radius:3cqw;transform-origin:left center;transition:transform .55s cubic-bezier(.3,1.3,.5,1)}
.fridge .door::before{content:"";position:absolute;right:3cqw;top:20cqw;width:1.8cqw;height:13cqw;background:var(--ink);border-radius:2cqw}
.fridge .door::after{content:"";position:absolute;left:0;right:0;top:16cqw;height:.7cqw;background:var(--ink)}
.fridge.open .door{transform:rotateY(-112deg)}

/* おさない ぼたん */
.bigbtn{width:46cqw;height:46cqw;border-radius:50%;background:#E8E2D6;border:.8cqw solid var(--ink);display:grid;place-items:center;box-shadow:0 2.2cqw 0 var(--ink)}
.bigbtn span{width:34cqw;height:34cqw;border-radius:50%;background:var(--red);border:.8cqw solid var(--ink);display:grid;place-items:center;font-family:var(--f-disp);color:#fff;font-size:8cqw;box-shadow:inset 0 -2.6cqw 0 rgba(0,0,0,.18);transition:transform .1s}
.bigbtn.press span{transform:translateY(1.6cqw) scale(.96)}

.slot{width:17cqw;height:20cqw;border:.7cqw dashed var(--mute);border-radius:2cqw;background:rgba(255,255,255,.5)}

/* まど・うえきばち */
.win{width:30cqw;height:34cqw;background:linear-gradient(#8FCBEA,#D9F0FA);border:1.8cqw solid #8A6B4A;border-radius:1cqw;display:grid;place-items:center;font-size:12cqw;box-shadow:0 0 8cqw rgba(255,236,170,.9)}
.pot{width:22cqw;height:16cqw;background:#B5643C;border:.8cqw solid var(--ink);border-radius:1cqw 1cqw 5cqw 5cqw;position:relative;box-shadow:inset 0 2.4cqw 0 #6B4A33}
.pot .sp{position:absolute;left:50%;bottom:88%;transform:translateX(-50%);font-size:15cqw;font-family:var(--f-emoji);line-height:1}

/* いえ */
.door2{width:26cqw;height:44cqw;background:#8A5A3C;border:.9cqw solid var(--ink);border-radius:13cqw 13cqw 1cqw 1cqw;position:relative;transition:background .4s}
.door2::after{content:"";position:absolute;right:3.4cqw;top:24cqw;width:3.4cqw;height:3.4cqw;border-radius:50%;background:var(--sun);border:.6cqw solid var(--ink)}
.door2.open{background:#2A2238}

/* らーめん */
.stove{width:38cqw;height:15cqw;background:#C9CED8;border:.8cqw solid var(--ink);border-radius:2cqw;display:flex;align-items:center;justify-content:flex-end;padding-right:3cqw;box-sizing:border-box}
.knob{width:6.4cqw;height:6.4cqw;border-radius:50%;background:var(--red);border:.6cqw solid var(--ink)}
.cup{width:22cqw;height:26cqw;position:relative}
.cup .body{position:absolute;left:0;right:0;bottom:0;height:22cqw;background:#fff;border:.8cqw solid var(--ink);border-radius:0 0 5cqw 5cqw;display:grid;place-items:center;font-family:var(--f-disp);font-size:4cqw;color:var(--terra);box-sizing:border-box}
.cup .lid{position:absolute;left:-1.4cqw;right:-1.4cqw;top:1.6cqw;height:3.6cqw;background:var(--terra);border:.7cqw solid var(--ink);border-radius:1cqw;transform-origin:100% 50%;transition:transform .35s}
.cup.open .lid{transform:translateY(-2cqw) rotate(-60deg)}
.cup.water .body{background:linear-gradient(#fff 0 26%,#E9C27A 26%)}
.st{font-family:var(--f-disp);font-size:5.6cqw;color:var(--ink);white-space:nowrap}

/* くらやみ */
.darkov{width:100cqw;height:100cqw;background:radial-gradient(circle at var(--lx,50%) var(--ly,70%),rgba(255,244,190,.10) 0 12cqw,rgba(10,14,28,.97) 19cqw)}

/* きんこ */
.frame{width:36cqw;height:26cqw;background:linear-gradient(#9FD0EE,#E3F2D6);border:2cqw solid #8A6B4A;display:grid;place-items:center;font-size:13cqw;font-family:var(--f-emoji)}
.memo{font-family:var(--f-body);font-weight:900;font-size:4cqw;background:#FFF8D6;border:.6cqw solid var(--ink);padding:2cqw 3cqw;width:32cqw;text-align:center;line-height:1.5;color:var(--ink);box-sizing:border-box}
.memo .em{font-family:var(--f-emoji);font-size:7cqw;display:block;letter-spacing:1.4cqw}
.safe{width:56cqw;height:40cqw;background:#7C8496;border:.9cqw solid var(--ink);border-radius:3cqw;box-shadow:inset 0 0 0 2cqw #8E97AA;display:grid;place-items:center;font-size:14cqw;transition:background .3s}
.safe.open{background:#2F3445}
.disp{font-family:var(--f-emoji);font-size:6.4cqw;letter-spacing:1.4cqw;color:#9FE3A8;background:var(--ink);border-radius:1.6cqw;padding:1.2cqw 3cqw;min-width:30cqw;text-align:center;white-space:nowrap}

/* ふきだし */
.bub{width:28cqw;font-family:var(--f-body);font-weight:900;font-size:4cqw;line-height:1.45;background:#fff;border:.6cqw solid var(--ink);border-radius:3cqw;padding:2cqw 1.6cqw;color:var(--ink);text-align:center;box-sizing:border-box}

/* でんき */
.lamp{width:20cqw;height:20cqw;border-radius:4cqw;border:.8cqw solid var(--ink);background:#FFF1B8;display:grid;place-items:center;font-size:11cqw;box-shadow:0 0 5cqw rgba(242,193,78,.85);transition:background .2s,box-shadow .2s}
.item.off .lamp{background:#3A4058;box-shadow:none}
.item.off .lamp span{filter:grayscale(1) brightness(.5)}

/* かわ・はのい */
.rules{width:84cqw;font-family:var(--f-body);font-size:3.2cqw;line-height:1.5;color:var(--ink);background:rgba(255,255,255,.92);border:.5cqw solid var(--ink);border-radius:2cqw;padding:1.2cqw 2.4cqw;font-weight:700;box-sizing:border-box}
.pegw{width:28cqw;height:42cqw;display:flex;justify-content:center;align-items:flex-end}
.peg{width:2.6cqw;height:40cqw;background:var(--ink);border-radius:1.4cqw 1.4cqw 0 0}
.base{height:3cqw;background:var(--ink);border-radius:1cqw}
.disk{height:7cqw;border:.7cqw solid var(--ink);border-radius:3.5cqw;box-sizing:border-box}

/* ひかる ぼたん */
.pad{width:30cqw;height:30cqw;border-radius:5cqw;border:.8cqw solid var(--ink);background:var(--c);filter:brightness(.6) saturate(.75);transition:filter .12s,transform .12s,box-shadow .12s}
.item.lit .pad{filter:brightness(1.15) saturate(1.1);transform:scale(1.05);box-shadow:0 0 6cqw var(--c)}

/* めいろ */
.wall{background:var(--ink);border-radius:1cqw}

/* すいどうかん */
.pipe{width:21cqw;height:21cqw;background:#F3EBDD;border:.6cqw solid var(--ink);border-radius:2cqw;position:relative;overflow:hidden;box-sizing:border-box}
.pipe .in{position:absolute;inset:0;transition:transform .2s}
.pipe .in i{position:absolute;background:#9AA3B5}
.pipe .h{left:0;right:0;top:38%;height:24%}
.pipe .v{left:38%;width:24%;top:0;height:62%}
.pipe .r{top:38%;height:24%;left:38%;right:0}
.item.wet .pipe .in i{background:#4FA3D9}

/* すらいど */
.sboard{width:69cqw;height:69cqw;background:#D6DEE6;border:.8cqw solid var(--ink);border-radius:3cqw;box-sizing:border-box}
.tile{width:20cqw;height:20cqw;background:var(--sun);border:.8cqw solid var(--ink);border-radius:2.4cqw;display:grid;place-items:center;font-family:var(--f-disp);font-size:11cqw;color:var(--ink);box-shadow:.8cqw .8cqw 0 var(--ink);box-sizing:border-box}

/* ろけっと */
.rk .g{transform:rotate(-45deg);transform-origin:50% 50%}
.rk.launch .g{animation:launch 1.1s ease-in forwards}

/* ひとこと と × */
.say{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:8px 16px;border-radius:18px;font-weight:700;font-size:15px;line-height:1.45;width:max-content;max-width:88%;text-align:center;opacity:0;transition:opacity .25s;pointer-events:none;z-index:60;box-sizing:border-box}
.say.on{opacity:1}
.xmark{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-family:var(--f-disp);font-size:150px;line-height:1;color:var(--blue);opacity:0;pointer-events:none;z-index:61;text-shadow:4px 4px 0 var(--card)}
.xmark.on{animation:xpop .7s ease forwards}

.tools{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;padding-top:6px}

.ov{position:fixed;inset:0;background:rgba(31,43,69,.55);display:grid;place-items:center;padding:16px;z-index:100}
.ovcard{background:var(--card);border:3px solid var(--ink);border-radius:20px;box-shadow:6px 6px 0 var(--ink);max-width:400px;width:100%;padding:24px 20px;text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center;box-sizing:border-box}
.stamp{width:118px;height:118px;border:15px solid var(--terra);border-radius:50%;animation:stamp .5s cubic-bezier(.2,1.6,.4,1);box-sizing:border-box}
.ovcard h3{font-family:var(--f-disp);font-weight:400;font-size:32px;margin:0;color:var(--terra)}
.ovcard h3.blue{color:var(--blue)}
.ovcard p{margin:0;line-height:1.8;font-size:16px;text-align:left}
.hk{font-family:var(--f-emoji);font-size:15px;cursor:pointer;opacity:.85}
.ans{background:var(--paper);border-radius:12px;padding:10px 14px;width:100%;box-sizing:border-box}
.ovbtns{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}

.end{display:flex;flex-direction:column;gap:16px;padding-top:10px}
.end .hero{text-align:center}
.end .big{font-family:var(--f-disp);font-size:clamp(34px,10vw,50px);margin:0;color:var(--terra)}

@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-10px)}40%{transform:translateX(9px)}60%{transform:translateX(-6px)}80%{transform:translateX(4px)}}
@keyframes xpop{0%{opacity:0;transform:translate(-50%,-50%) scale(.4)}25%{opacity:1;transform:translate(-50%,-50%) scale(1.05)}70%{opacity:1}100%{opacity:0;transform:translate(-50%,-50%) scale(1)}}
@keyframes stamp{0%{transform:scale(2.2);opacity:0}100%{transform:scale(1);opacity:1}}
@keyframes bob{0%,100%{transform:translateY(0);opacity:.9}50%{transform:translateY(-2.5cqw);opacity:.5}}
@keyframes flee{to{transform:translate(70cqw,-20cqw) scale(.5);opacity:0}}
@keyframes launch{0%{transform:rotate(-45deg)}20%{transform:translateY(1.5cqw) rotate(-45deg)}100%{transform:translateY(-140cqw) rotate(-45deg)}}
@media (prefers-reduced-motion:reduce){
  .zz .g{animation:none}
  .stage.shake{animation:none}
  .flee .g,.rk.launch .g{animation:none;opacity:0}
}
</style>

<div class="app">
  <header class="topbar">
    <button class="logo" id="home" type="button">ひらめき<b>トラップ</b></button>
    <button class="iconbtn" id="mute" type="button" aria-pressed="false">おと あり</button>
  </header>

  <section class="title" id="scr-title">
    <div class="hero">
      <div class="q" aria-hidden="true">？</div>
      <h1>ひらめき<br><span>トラップ</span></h1>
      <p>もんだいぶんを よく よんで、えを さわったり うごかしたり して とく「ひっかけ もんだい」が 24もん。けいさんは いりません。ひつようなのは、ひらめきと ちゅういりょく。</p>
      <div class="howto">
        <span class="chip">さわる ＝ ゆびで とんと おす</span>
        <span class="chip">ひっぱる ＝ ゆびで うごかす</span>
        <span class="chip">こまったら ひんと</span>
      </div>
      <div class="row">
        <button class="btn primary" id="start" type="button">はじめる</button>
      </div>
    </div>
    <div id="sections"></div>
    <p class="pagenote">といた もんだいには ○が つきます（この ぶらうざに きろく されます）。</p>
  </section>

  <section class="play" id="scr-play" hidden>
    <div class="qcard">
      <div class="qmeta"><span class="qno" id="qno">だい1もん</span><span class="prog" id="prog">1 / 24</span></div>
      <h2 id="q"></h2>
    </div>
    <div class="stagewrap">
      <div class="stage" id="stage"></div>
      <div class="xmark" id="xmark" aria-hidden="true">×</div>
      <div class="say" id="say" role="status" aria-live="polite"></div>
    </div>
    <div class="tools">

      if(!cs.includes(from)) break;
      wet.push(i);
      const out=cs.find(d=>d!==from);
      const nr=r+(out===2?1:out===0?-1:0), nc=c+(out===1?1:out===3?-1:0);
      if(nr<0||nr>2||nc<0||nc>2){ ok=(r===2&&c===2&&out===1); break; }
      r=nr; c=nc; from=(out+2)%4;
    }
    for(let i=0;i<9;i++) a.el('t'+i).classList.toggle('wet',wet.includes(i));
    return ok;
  },
  onTap(id,a){
    if(!/^t\d$/.test(id)) return;
    const i=+id.slice(1); a.state.rot[i]=(a.state.rot[i]+1)%4; a.state.deg[i]+=90;
    this.draw(a); a.beep(360);
    if(this.walk(a)) a.timer(()=>a.clear(),500);
  }
},
{
  q:'わを ぜんぶ みぎの ぼうに うつして',
  hint:'いちばん ちいさい わを、まず「みぎ」に おいて みよう。ちいさい わは 1かいおきに うごかすのが こつ。',
  answer:'ちいさい→みぎ、まんなかの わ→まんなか、ちいさい→まんなか、おおきい→みぎ、ちいさい→ひだり、まんなかの わ→みぎ、ちいさい→みぎ の 7かいで できます。',
  explain:'さいたん 7かいで うつせる パズル でした。むかしから ある「はのいの とう」という あたまの たいそう です。',
  items:[
    {id:'rules',html:'<div class="rules">ぼうを さわって わを もちあげ、べつの ぼうを さわって おろす。<br>おおきい わは、ちいさい わの うえには おけない。</div>',x:50,y:11,deco:1},
    {id:'base',html:'<div class="base" style="width:92cqw"></div>',x:50,y:82,deco:1},
    {id:'p0',html:'<div class="pegw"><div class="peg"></div></div>',x:18,y:60},
    {id:'p1',html:'<div class="pegw"><div class="peg"></div></div>',x:50,y:60},
    {id:'p2',html:'<div class="pegw"><div class="peg"></div></div>',x:82,y:60},
    {id:'d2',html:'<div class="disk" style="width:27cqw;background:#BF5A36"></div>',x:18,y:76},
    {id:'d1',html:'<div class="disk" style="width:20cqw;background:#3F6E9E"></div>',x:18,y:68},
    {id:'d0',html:'<div class="disk" style="width:13cqw;background:#F2C14E"></div>',x:18,y:60}
  ],
  X:[18,50,82],
  init(a){ a.state.t=[[2,1,0],[],[]]; a.state.sel=null; },
  draw(a){
    const s=a.state;
    s.t.forEach((st,p)=>st.forEach((d,k)=>{
      const top=(k===st.length-1&&s.sel===p);
      a.move('d'+d,this.X[p],top?30:76-k*8);
    }));
  },
  peg(a,p){
    const s=a.state;
    if(s.sel===null){
      if(!s.t[p].length){ a.say('この ぼうには わが ないよ'); return; }
      s.sel=p; a.beep(500);
    } else if(s.sel===p){ s.sel=null; }
    else {
      const from=s.t[s.sel], top=from[from.length-1], dest=s.t[p], under=dest[dest.length-1];
      if(under!==undefined&&under<top){ a.wrong('おおきい わは ちいさい わの うえに おけない'); s.sel=null; }
      else { from.pop(); dest.push(top); s.sel=null; a.beep(600); }
    }
    this.draw(a);
    if(s.t[2].length===3) a.timer(()=>a.clear(),450);
  },
  onTap(id,a){
    if(/^p\d$/.test(id)) this.peg(a,+id[1]);
    else if(/^d\d$/.test(id)){ const d=+id[1]; const p=a.state.t.findIndex(st=>st.includes(d)); this.peg(a,p); }
  }
},
{
  q:'みんなを ぶじに むこうぎしへ わたらせて',
  hint:'さいしょに はこぶのは やぎ。いちど はこんだ ものを、また つれて かえっても いいんだよ。',
  answer:'やぎを はこぶ → ひとりで もどる → おおかみを はこぶ → やぎを つれて もどる → きゃべつを はこぶ → ひとりで もどる → やぎを はこぶ。',
  explain:'やぎを いったん つれて かえるのが ひらめきの ぽいんと。7かいの いききで、ぜんいん ぶじに わたれました。',
  bg:'river',
  items:[
    {id:'rules',html:'<div class="rules">ふねに のれるのは のうふと もう ひとつ だけ。<br>のうふが いないと、おおかみは やぎを、やぎは きゃべつを たべちゃう。<br>さわると のる・おりる。ふねを さわると しゅっぱつ。</div>',x:50,y:14,deco:1},
    {id:'boat',g:'🛶',x:34,y:66,s:26},
    {id:'man',g:'👨‍🌾',x:28,y:54,s:11},
    {id:'wolf',g:'🐺',x:10,y:40,s:12},
    {id:'goat',g:'🐐',x:10,y:58,s:12},
    {id:'cab',g:'🥬',x:10,y:76,s:12}
  ],
  BX:{L:34,R:66}, BANK:{L:10,R:90}, SY:{wolf:40,goat:58,cab:76},
  NAME:{wolf:'おおかみ',goat:'やぎ',cab:'きゃべつ'},
  init(a){ a.state.pos={wolf:'L',goat:'L',cab:'L'}; a.state.boat='L'; a.state.busy=false; },
  place(a){
    const s=a.state, bx=this.BX[s.boat];
    ['wolf','goat','cab'].forEach(k=>{ if(s.pos[k]==='B') a.move(k,bx+6,54); else a.move(k,this.BANK[s.pos[k]],this.SY[k]); });
    a.move('boat',bx,66); a.move('man',bx-6,54);
  },
  cargo(a){ return ['wolf','goat','cab'].find(k=>a.state.pos[k]==='B'); },
  side(a,k){ const p=a.state.pos[k]; return p==='B'?a.state.boat:p; },
  onTap(id,a){
    const s=a.state; if(s.busy) return;
    if(id==='boat'||id==='man'){
      const old=s.boat; s.boat=old==='L'?'R':'L'; this.place(a); a.beep(300); s.busy=true;
      a.timer(()=>{
        s.busy=false;
        const left=['wolf','goat','cab'].filter(k=>s.pos[k]===old);
        let bad=null;
        if(left.includes('wolf')&&left.includes('goat')) bad='おおかみが やぎを たべちゃった！';
        else if(left.includes('goat')&&left.includes('cab')) bad='やぎが きゃべつを たべちゃった！';
        if(bad){ s.busy=true; a.wrong(bad); a.timer(()=>{ this.init(a); this.place(a); a.say('さいしょから やりなおし'); },1600); return; }
        if(['wolf','goat','cab'].every(k=>this.side(a,k)==='R')) a.clear();
      },450);
      return;
    }
    if(!this.NAME[id]) return;
    if(s.pos[id]==='B'){ s.pos[id]=s.boat; this.place(a); return; }
    if(s.pos[id]!==s.boat){ a.say('ふねは むこうぎしに あるよ'); return; }
    if(this.cargo(a)){ a.say('ふねには ひとつ しか のせられない'); return; }
    s.pos[id]='B'; this.place(a);
  }
},
{
  q:'もじを ならべかえて「ひらめきとらっぷ」に して',
  hint:'うえの だん「ひらめ」から じゅんに そろえよう。そろった ところは なるべく うごかさない。',
  answer:'うえの だんを「ひ ら め」、まんなかを「き と ら」、したを「っ ぷ」と ならべ、みぎしたを あけます。あいて いる ところの となりの もじを さわると すべります。',
  explain:'みごと「ひらめきとらっぷ」が そろいました。ぜんもん くりあ です！',
  L:['ひ','ら','め','き','と','ら','っ','ぷ'], X:[28,50,72], Y:[34,56,78],
  items(){
    const r=[{id:'board',html:'<div class="sboard"></div>',x:50,y:56,deco:1},{id:'lbl',html:PILL('ひらめきとらっぷ','sm'),x:50,y:9,deco:1}];
    this.L.forEach((ch,k)=>r.push({id:'t'+k,html:'<div class="tile">'+ch+'</div>',x:this.X[k%3],y:this.Y[Math.floor(k/3)]}));
    return r;
  },
  str(g){ return g.map(k=>k<0?'':this.L[k]).join(''); },
  solved(g){ return g[8]===-1&&this.str(g)==='ひらめきとらっぷ'; },
  nb(i){ const r=Math.floor(i/3),c=i%3,o=[]; if(r>0)o.push(i-3); if(r<2)o.push(i+3); if(c>0)o.push(i-1); if(c<2)o.push(i+1); return o; },
  init(a){
    let g;
    do{
      g=[0,1,2,3,4,5,6,7,-1]; let prev=-1;
      for(let n=0;n<40;n++){
        const b=g.indexOf(-1), opts=this.nb(b).filter(x=>x!==prev), m=opts[Math.floor(Math.random()*opts.length)];
        g[b]=g[m]; g[m]=-1; prev=b;
      }
    } while(this.solved(g));
    a.state.g=g; a.timer(()=>this.draw(a),350);
  },
  draw(a){ a.state.g.forEach((k,i)=>{ if(k>=0) a.move('t'+k,this.X[i%3],this.Y[Math.floor(i/3)]); }); },
  onTap(id,a){
    if(!/^t\d$/.test(id)) return;
    const g=a.state.g, k=+id.slice(1), i=g.indexOf(k), b=g.indexOf(-1);
    if(!this.nb(b).includes(i)){ a.say('あいて いる ところの となりの もじ だけ うごくよ'); return; }
    g[b]=k; g[i]=-1; this.draw(a); a.beep(480);
    if(this.solved(g)) a.timer(()=>a.clear(),450);
  }
}
];

/* ===== きろく ===== */
const KEY='hirameki-trap-v3';
let saved={cleared:[],hints:0};
try{ const s=JSON.parse(localStorage.getItem(KEY)||'null'); if(s&&Array.isArray(s.cleared)) saved=s; }catch(e){}
function save(){ try{ localStorage.setItem(KEY,JSON.stringify(saved)); }catch(e){} }

let cur=0, done=false, state={}, timers=[], muted=false, sayT=null;
const $=id=>document.getElementById(id);
const stage=$('stage');
const lv=()=>LEVELS[cur];

/* ===== おと ===== */
let ac=null;
function tone(seq){
  if(muted) return;
  try{
    ac=ac||new (window.AudioContext||window.webkitAudioContext)();
    const t=ac.currentTime;
    seq.forEach(([f,d,st])=>{
      const o=ac.createOscillator(), g=ac.createGain();
      o.type='triangle'; o.frequency.value=f;
      g.gain.setValueAtTime(.0001,t+st);
      g.gain.exponentialRampToValueAtTime(.2,t+st+.02);
      g.gain.exponentialRampToValueAtTime(.0001,t+st+d);
      o.connect(g); g.connect(ac.destination);
      o.start(t+st); o.stop(t+st+d+.05);
    });
  }catch(e){}
}

/* ===== しくみ ===== */
function stopTimers(){ timers.forEach(t=>{clearTimeout(t);clearInterval(t);}); timers=[]; }
function setPos(el,x,y){ el.dataset.x=x; el.dataset.y=y; el.style.left=x+'%'; el.style.top=y+'%'; }
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));

const api={
  get stage(){ return stage; },
  get state(){ return state; },
  el:id=>stage.querySelector('[data-id="'+id+'"]'),
  set(id,g){ const e=api.el(id); if(e) e.querySelector('.g').textContent=g; },
  hide(id){ const e=api.el(id); if(e) e.classList.add('gone'); },
  show(id){ const e=api.el(id); if(e) e.classList.remove('gone'); },
  move(id,x,y){ const e=api.el(id); if(!e) return; e.classList.add('anim'); setPos(e,x,y); clearTimeout(e._at); e._at=setTimeout(()=>e.classList.remove('anim'),420); },
  back(id){ const e=api.el(id); if(e) api.move(id,+e.dataset.ox,+e.dataset.oy); },
  hits(a,b,k){
    k=k==null?.3:k;
    const ea=api.el(a), eb=api.el(b); if(!ea||!eb) return false;
    const A=ea.querySelector('.g').getBoundingClientRect(), B=eb.querySelector('.g').getBoundingClientRect();
    const w=Math.min(A.right,B.right)-Math.max(A.left,B.left), h=Math.min(A.bottom,B.bottom)-Math.max(A.top,B.top);
    if(w<=0||h<=0) return false;
    return (w*h)/Math.min(A.width*A.height,B.width*B.height)>k;
  },
  timer(fn,ms){ timers.push(setTimeout(fn,ms)); },
  interval(fn,ms){ timers.push(setInterval(fn,ms)); },
  stopTimers,
  restart(){ startLevel(cur); },
  beep(f){ tone([[f,.22,0]]); },
  say(msg){
    const s=$('say'); s.textContent=msg; s.classList.add('on');
    clearTimeout(sayT); sayT=setTimeout(()=>s.classList.remove('on'),Math.max(2000,1000+msg.length*90));
  },
  wrong(msg){
    stage.classList.remove('shake'); void stage.offsetWidth; stage.classList.add('shake');
    const x=$('xmark'); x.classList.remove('on'); void x.offsetWidth; x.classList.add('on');
    if(msg) api.say(msg);
    tone([[233,.22,0],[175,.3,.13]]);
  },
  clear(){
    if(done) return;
    done=true; stopTimers();
    if(!saved.cleared.includes(cur)) saved.cleared.push(cur);
    save();
    tone([[523,.16,0],[659,.16,.12],[784,.32,.24]]);
    setTimeout(showClear,650);
  }
};

function secOf(i){ return SECTIONS[Math.floor(i/PER)]; }

function startLevel(i){
  stopTimers();
  cur=i; done=false; state={};
  const L=lv();
  show('play');
  $('qno').textContent='だい'+(i+1)+'もん・'+secOf(i).name;
  $('prog').textContent=(i+1)+' / '+LEVELS.length;
  $('q').innerHTML=L.q;
  $('say').classList.remove('on');
  stage.className='stage'+(L.bg?' '+L.bg:'');
  stage.innerHTML=L.floor?'<div class="floor"></div>':'';
  const items=typeof L.items==='function'?L.items():L.items;
  items.forEach(it=>{
    const el=document.createElement('div');
    el.className='item'+(it.drag?' drag':'')+(it.cls?' '+it.cls:'')+(it.deco?' deco':'')+(it.hide?' gone':'');
    el.dataset.id=it.id; el.dataset.ox=it.x; el.dataset.oy=it.y;
    if(it.s){ el.style.fontSize=it.s+'cqw'; el.dataset.s=it.s; }
    if(it.z) el.style.zIndex=it.z;
    const g=document.createElement('span'); g.className='g';
    if(it.html) g.innerHTML=it.html; else g.textContent=it.g;
    if(it.col) g.style.color=it.col;
    el.appendChild(g);
    if(!it.deco){ el.tabIndex=0; el.setAttribute('role','button'); el.setAttribute('aria-label',it.g||'ぼたん'); }
    setPos(el,it.x,it.y);
    stage.appendChild(el);
  });
  if(L.init) L.init(api);
  hot();
}

/* さわる・ひっぱる */
let drag=null;
stage.addEventListener('pointerdown',e=>{
  const el=e.target.closest('.item'); if(!el||done||el.classList.contains('deco')) return;
  e.preventDefault();
  const r=stage.getBoundingClientRect();
  drag={el,id:el.dataset.id,sx:e.clientX,sy:e.clientY,moved:false,can:el.classList.contains('drag'),
    ox:+el.dataset.x-(e.clientX-r.left)/r.width*100, oy:+el.dataset.y-(e.clientY-r.top)/r.height*100};
  try{ el.setPointerCapture(e.pointerId); }catch(_){}
  if(drag.can) el.classList.add('lift');
});
stage.addEventListener('pointermove',e=>{
  if(!drag) return;
  if(Math.hypot(e.clientX-drag.sx,e.clientY-drag.sy)>8) drag.moved=true;
  if(drag.can&&drag.moved){
    const r=stage.getBoundingClientRect();
    drag.el.classList.remove('anim');
    setPos(drag.el, clamp((e.clientX-r.left)/r.width*100+drag.ox,4,96), clamp((e.clientY-r.top)/r.height*100+drag.oy,4,96));
    const L=lv(); if(L.onMove) L.onMove(drag.id,api);
  }
});
function endDrag(cancel){
  if(!drag) return;
  const d=drag; drag=null; d.el.classList.remove('lift');
  if(done||cancel) return;
  const L=lv();
  if(!d.moved){ if(L.onTap) L.onTap(d.id,api); }
  else if(d.can && L.onDrop) L.onDrop(d.id,api);
}
stage.addEventListener('pointerup',()=>endDrag(false));
stage.addEventListener('pointercancel',()=>endDrag(true));
stage.addEventListener('keydown',e=>{
  if(e.key!=='Enter'&&e.key!==' ') return;
  const el=e.target.closest('.item'); if(!el||done) return;
  e.preventDefault(); const L=lv(); if(L.onTap) L.onTap(el.dataset.id,api);
});
$('q').addEventListener('click',e=>{
  const t=e.target.closest('[data-id]'); if(!t||done) return;
  const L=lv(); if(L.onTap) L.onTap(t.dataset.id,api);
});

/* ===== がめん ===== */
function show(name){
  $('scr-title').hidden=name!=='title';
  $('scr-play').hidden=name!=='play';
  $('scr-end').hidden=name!=='end';
  window.scrollTo(0,0);
}
function renderGrid(){
  const box=$('sections'); box.innerHTML='';
  SECTIONS.forEach((sec,si)=>{
    const h=document.createElement('h2'); h.className='sect';
    h.innerHTML=sec.name+' <small>'+(si*PER+1)+'〜'+(si*PER+PER)+'もん　'+sec.sub+'</small>';
    const g=document.createElement('div'); g.className='grid'; g.style.marginTop='10px';
    for(let i=si*PER;i<si*PER+PER;i++){
      const b=document.createElement('button'), ok=saved.cleared.includes(i);
      b.type='button'; b.className='lv'+(ok?' done':''); b.textContent=i+1;
      b.setAttribute('aria-label','だい'+(i+1)+'もん'+(ok?'（くりあ ずみ）':''));
      b.onclick=()=>startLevel(i);
      g.appendChild(b);
    }
    box.appendChild(h); box.appendChild(g);
  });
}
function goTitle(){ stopTimers(); closeOv(); renderGrid(); show('title'); hot(); }
function closeOv(){ $('ov-clear').hidden=true; $('ov-hint').hidden=true; }

function showClear(){
  $('ov-hint').hidden=true;
  $('clear-txt').textContent=lv().explain;
  $('btn-next').textContent=cur===LEVELS.length-1?'けっかを みる':(cur+1)%PER===0?'つぎの しょうへ':'つぎの もんだいへ';
  $('ov-clear').hidden=false;
  $('btn-next').focus();
}
$('btn-next').onclick=()=>{
  $('ov-clear').hidden=true;
  if(cur<LEVELS.length-1) startLevel(cur+1);
  else{
    stopTimers();
    $('endtxt').textContent='24もん すべて くりあ しました。ひんとを みた かいすうは '+saved.hints+' かい です。ともだちや かぞくにも だして みてね。';
    show('end');
  }
};
$('btn-hint').onclick=()=>{
  if(done) return;
  saved.hints++; save();
  const L=lv();
  if(L.hintHtml) $('hint-txt').innerHTML=L.hintHtml; else $('hint-txt').textContent=L.hint;
  $('ans-txt').textContent=L.answer;
  $('ans-txt').hidden=true;
  $('btn-ans').hidden=false;
  $('ov-hint').hidden=false;
  $('btn-hclose').focus();
};
function hintKey(e){
  const k=e.target.closest('[data-k]'); if(!k||done) return;
  const L=lv(); if(!L.onHintKey) return;
  $('ov-hint').hidden=true; L.onHintKey(api);
}
$('hint-txt').addEventListener('click',hintKey);
$('hint-txt').addEventListener('keydown',e=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); hintKey(e); } });
$('btn-ans').onclick=()=>{ $('ans-txt').hidden=false; $('btn-ans').hidden=true; };
$('btn-hclose').onclick=()=>{ $('ov-hint').hidden=true; };
$('btn-retry').onclick=()=>startLevel(cur);
$('btn-menu').onclick=goTitle;
$('home').onclick=goTitle;
$('tomenu').onclick=goTitle;
$('again').onclick=()=>{ saved={cleared:[],hints:0}; save(); startLevel(0); };
$('start').onclick=()=>{ const first=LEVELS.findIndex((_,i)=>!saved.cleared.includes(i)); startLevel(first<0?0:first); };
$('mute').onclick=()=>{
  muted=!muted;
  $('mute').textContent=muted?'おと なし':'おと あり';
  $('mute').setAttribute('aria-pressed',String(muted));
};

function hot(){ try{ window.claude?.hot?.snapshot?.(()=>({cur,play:!$('scr-play').hidden})); }catch(e){} }
function boot(data){
  renderGrid();
  if(data && data.play && typeof data.cur==='number' && LEVELS[data.cur]) startLevel(data.cur);
  else show('title');
}
if(window.claude?.hot?.ready) window.claude.hot.ready(boot); else boot(window.claude?.hot?.data ?? {});
})();
</script>
